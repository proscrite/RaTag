run_id: "RUN36"
description: "Single isotope Th228 analysis, 25 kV/cm EL field"

# Data location
data:
  raw_data_path: "\\\\Lab104con\\K\\AXO-RITA\\raw_data\\RUN36_EL25kVcm"
  output_base: "\\\\Lab104con\\K\\AXO-RITA\\processed\\RUN36_EL25kVcm"  # Optional, defaults to raw_data_path
  pmt_pattern: "*_CH3.wfm"
  alpha_pattern: "*_CH4.wfm"

# Run parameters
experiment:
  el_field: 25000.0          # V/cm - EL field
  target_isotope: "multi"   # Isotope being studied
  pressure: 1.0             # bar - Gas pressure
  temperature: 297.0        # K - Temperature
  sampling_rate: 5.0e9      # Hz - Oscilloscope sampling rate
  el_gap: 0.04               # cm - EL gap distance
  drift_gap: 0.48            # cm - Drift gap distance
  width_s2: 1.1             # µs - S2 signal width
  W_value: 22.0             # eV - Mean energy per ion pair
  E_gamma_xray: 12300.0     # eV - X-ray energy

execution:
  run_alphas: true
  run_xrays: false
  run_recoils: true
  
#  Multi-isotope configuration (optional)
multi_isotope:
  enabled: true
  isotope_ranges:
    Th228: [4.0, 4.7]       # V
    Ra224: [4.7, 5.0]       # V
    Rn220: [5.2, 5.5]       # V
    Po216: [5.5, 6.0]       # V
    Po212: [6.0, 10.0]      # V

# Energy mapping and calibration configuration
energy_mapping:
  force: false
  generate: true            # Set to false to skip regeneration if maps exist
  max_frames: null          # Number of frames to process (null = all)
  pattern: "*.wfm"       # Glob pattern for alpha channel files
  savgol_window: 501        # Savitzky-Golay window size (21-5001, must be odd, default: 501)
  nbins: 120                # Number of bins for energy spectrum histograms
  energy_range: [4, 10.2]    # MeV - Energy range for spectrum fitting [SCA scale]
  n_sigma: 2.0              # Number of sigmas for isotope range definition (default: 2.0)
  use_quadratic: true       # Use quadratic (vs linear) energy calibration

# Preparation stage (S1/S2 timing estimation)
preparation:
  force: true
  max_frames: null       # Number of frames for S1 estimation
  s1_t_min: -4.0            # µs- S1 window low bound 
  s1_t_max: -2.5            # µs - S1 window high bound
  s1_v_min: 3.0             # mV - S1 window low bound
  s1_v_max: 15.0            # mV - S1 window high bound
  s1_max_area: 0.15         # mV·µs - S1 area detection threshold

  s2_margin: 0.9
  s2_threshold: 0.5
  s2_fraction: 0.05
  s2_min_area: 0.5
  s2_max_area: 50
  s2_min_width: 0.2
  
# Integration stage (S2 area calculation)
integration:
  force: false
  max_frames: null          # null = all frames, or specify number
  n_pedestal: 100         # Samples for pedestal calculation
  ma_window: 9            # Moving average window size
  bs_threshold: 0.8      # mV - Baseline subtraction threshold
  dt: 0.0002              # µs - Time step for integration (0.2 ns for 5 GS/s)

fit_config:
  force: true
  bin_cuts: [0, 10]       # mV·µs - Histogram range
  nbins: 100              # Number of histogram bins
  bg_threshold: 0.5       # Background fraction threshold for two-stage fitting (0-1)
  bg_cutoff: 0.07          # mV·µs - Upper limit for background fitting
  n_sigma: 3.0            # Sigmas above background mean for signal region cutoff
  upper_limit: 5.0        # mV·µs - Upper limit for signal fitting range

# X-ray classification
xray_classification:
  force: false
  max_frames: null          # null = all frames, or specify number
  bs_threshold: 0.5         # mV - Baseline threshold for signal detection
  max_area_s1: 1.0e5        # mV·µs - Max allowed area before S1 (reject large pre-S1 signals)
  max_area_s2: 1.0e5        # mV·µs - Max allowed area in S2 window (reject noise/pile-up)
  min_xray_area: 0.0        # mV·µs - Min required X-ray area (reject low-quality events)
  min_s2_sep: 1.0           # µs - Min required separation before S2 window
  min_s1_sep: 0.5           # µs - Min required separation after S1
  n_pedestal: 200           # Samples for pedestal calculation
  ma_window: 10             # Moving average window size
  dt: 0.0002                # µs - Integration timestep